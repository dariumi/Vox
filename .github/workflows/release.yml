name: Release to PyPI

# Builds the sdist and the wheels (CPU build: the Vulkan backend is optional and is left out when the Vulkan headers are not
# there; build from source for it) and uploads them to PyPI through Trusted Publishing when a GitHub release is published.
on:
  release:
    types: [published]
  workflow_dispatch:   # build only; nothing is uploaded

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build twine && python -m build --sdist && twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist-sdist, path: dist/*.tar.gz }

  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686 pp*"
          CIBW_TEST_COMMAND: "python -c \"import vox; print(vox.__version__)\""
          MACOSX_DEPLOYMENT_TARGET: "13.0"
      - uses: actions/upload-artifact@v4
        with: { name: "dist-wheels-${{ matrix.os }}", path: wheelhouse/*.whl }

  publish:
    needs: [sdist, wheels]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing: no token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "dist-*", path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
