name: Release to PyPI

# Builds the sdist and the wheels (Linux, macOS, Windows; Vulkan on Linux and Windows, found at run time) and uploads them to PyPI through Trusted Publishing when a GitHub release is published.
on:
  release:
    types: [published]
  workflow_dispatch:   # build only; nothing is uploaded

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install build twine && python -m build --sdist && twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: dist-sdist, path: dist/*.tar.gz }

  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pypa/cibuildwheel@faf86a6ed7efa889faf6996aa23820831055001a # v2.23.3
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28   # gcc 12: the sources need __builtin_bit_cast and the f16c cpu check
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          # only the Khronos headers are needed: the Vulkan loader is opened at run time, so the wheel also imports without a driver
          CIBW_BEFORE_ALL: git init third_party/vulkan-headers && git -C third_party/vulkan-headers fetch --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git d4a196d8c84e032d27f999adcea3075517c1c97f && git -C third_party/vulkan-headers checkout FETCH_HEAD   # v1.4.304, pinned by commit
          CIBW_ENVIRONMENT_MACOS: CMAKE_ARGS="-DVOX_VULKAN=OFF"   # no Vulkan on macOS
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686 pp*"
          CIBW_TEST_COMMAND: 'python -c "import vox; print(vox.__version__)"'
          MACOSX_DEPLOYMENT_TARGET: "13.0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "dist-wheels-${{ matrix.os }}", path: wheelhouse/*.whl }

  publish:
    needs: [sdist, wheels]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing: no token is stored anywhere
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: "dist-*", path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
