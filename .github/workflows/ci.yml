name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  VOCAB_URL: https://raw.githubusercontent.com/ggml-org/llama.cpp/master/models/ggml-vocab-qwen2.gguf

jobs:
  linux:
    name: Linux (CPU + Vulkan/lavapipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-tools glslang-tools
      - name: Shaders compile
        run: for f in src/shaders/*.comp; do glslangValidator -V --target-env vulkan1.1 -o /dev/null "$f"; done
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j4
      - name: Unit tests
        run: cd build && ./vox_tests
      - name: Devices
        run: ./build/vox devices
      - name: Python package
        run: pip install numpy tokenizers regex && pip install .
      - name: Vocabulary for tokenizer tests
        run: curl -sSL -o qwen2.gguf "$VOCAB_URL"
      - name: Tokenizer vs HF tokenizers
        run: python tests/test_tokenizer.py build/vox qwen2.gguf
      - name: Tiny model vs numpy reference (CPU)
        run: VOX_QWEN2_GGUF=qwen2.gguf VOX_TEST_DEVICE=cpu python tests/test_qwen3_tiny.py build/vox
      - name: Tiny model vs numpy reference (Vulkan, GPU codec decoder)
        run: VOX_QWEN2_GGUF=qwen2.gguf VOX_TEST_DEVICE=vulkan:0,strict python tests/test_qwen3_tiny.py build/vox
      - name: Python API
        run: python tests/test_python.py
      - name: Language examples (C, C++, Rust, Go, Node.js, ctypes) give the CLI's audio bit for bit
        run: python tests/test_examples.py build/vox
      - name: Website and vox.js are up to date
        run: python tools/build_site.py && git diff --exit-code docs
      - name: Tiny model, hybrid talker (1 layer on GPU, rest on CPU)
        run: VOX_QWEN2_GGUF=qwen2.gguf VOX_TEST_DEVICE=vulkan:0,layers=1,strict python tests/test_qwen3_tiny.py build/vox
      - name: Python as a library (resources, sessions, memory limits)
        run: VOX_QWEN2_GGUF=qwen2.gguf python tests/test_library.py
      - name: Python model families
        run: VOX_QWEN2_GGUF=qwen2.gguf python tests/test_py_family.py
      - name: HTTP server
        run: VOX_QWEN2_GGUF=qwen2.gguf python tests/test_api_serve.py

  official:
    name: Against the official qwen_tts implementation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
      - name: Reference implementation (CPU torch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.57.3 accelerate==1.12.0 librosa soundfile einops sox onnxruntime numpy tokenizers regex
          pip install --no-deps qwen-tts==0.1.1
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j4 && pip install .
      - name: Vocabulary
        run: curl -sSL -o qwen2.gguf "$VOCAB_URL"
      - name: vox vs qwen_tts (CPU, Vulkan GPU decoder, Vulkan CPU decoder)
        run: VOX_QWEN2_GGUF=qwen2.gguf VOX_TEST_DEVICES="cpu;vulkan:0,strict;vulkan:0,codec=cpu,strict" python tests/test_official.py build/vox
      - name: Q4 quantisation (CPU and Vulkan vs official)
        run: VOX_QWEN2_GGUF=qwen2.gguf VOX_TEST_DEVICES="cpu;vulkan:0,strict" python tests/test_q4.py build/vox
      - name: HTTP server incl. native voice creation
        run: VOX_QWEN2_GGUF=qwen2.gguf python tests/test_api_serve.py
      - name: F5-TTS reference packages
        run: |
          pip install f5-tts vocos pypinyin rjieba safetensors
          pip install transformers==4.57.3 accelerate==1.12.0
      - name: F5-TTS vs official f5_tts / vocos (tiny random model; CPU and Vulkan)
        run: VOX_TEST_DEVICES="cpu;vulkan:0,strict" python tests/test_f5_tiny.py build/vox
      - name: Kokoro vs official kokoro / misaki (tiny random model; stages, KPipeline pieces, built-in G2P)
        run: |
          pip install --no-deps kokoro misaki
          pip install loguru num2words spacy phonemizer-fork espeakng-loader
          python tests/test_kokoro_tiny.py build/vox
      - name: CosyVoice2 vs the official CosyVoice code (tiny random model; frontend, LLM, flow, HiFT, text frontend)
        run: |
          git clone https://github.com/FunAudioLLM/CosyVoice ../CosyVoice && git -C ../CosyVoice checkout 074ca6dc9e80a2f424f1f74b48bdd7d3fea531cc
          git -C ../CosyVoice submodule update --init third_party/Matcha-TTS
          pip install onnx onnxruntime s3tokenizer inflect pyyaml omegaconf conformer diffusers einops hyperpyyaml
          VOX_COSYVOICE_SRC=../CosyVoice VOX_QWEN2_GGUF=qwen2.gguf python tests/test_cosyvoice_tiny.py build/vox
      - name: Chatterbox vs the official chatterbox-tts (tiny random model; T3, VoiceEncoder, S3Gen, cloning, text)
        run: |
          pip install --no-deps chatterbox-tts==0.1.7
          pip install librosa resemble-perth conformer diffusers einops omegaconf s3tokenizer safetensors
          python tests/test_chatterbox_tiny.py build/vox
      - name: vox.js in Chromium (WebGPU via SwiftShader) vs official f5_tts / vocos
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python tests/test_web.py build/vox
          python tests/test_web_convert.py
      - name: vox.js Qwen3-TTS in Chromium (load from HF link, WebGPU, duplex)
        run: VOX_QWEN2_GGUF=qwen2.gguf python tests/test_web_qwen.py build/vox
      - name: vox.js without WebGPU (CPU backend) vs core and WebGPU
        run: VOX_QWEN2_GGUF=qwen2.gguf python tests/test_web_cpu.py build/vox
      - name: Duplex streaming (core, Python, CLI, WebSocket)
        run: VOX_QWEN2_GGUF=qwen2.gguf python tests/test_duplex.py build/vox
      - name: Voice profiles and markup
        run: python tests/test_profiles.py build/vox
      - name: vox web and the Studio page
        run: python tests/test_web_studio.py

  aarch64:
    name: aarch64 cross build (qemu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu qemu-user
      - name: Build
        run: |
          cmake -S . -B build-arm -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ -DVOX_VULKAN=OFF -DVOX_PYTHON=OFF
          cmake --build build-arm -j4
      - name: Unit tests under qemu
        run: cd build-arm && qemu-aarch64 -L /usr/aarch64-linux-gnu ./vox_tests

  macos:
    name: macOS (CPU, experimental)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVOX_VULKAN=OFF -DVOX_PYTHON=OFF && cmake --build build -j4
      - name: Unit tests
        run: cd build && ./vox_tests
